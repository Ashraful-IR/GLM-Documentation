name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ───────────────────────────── Quality gates (parallel) ──────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit:
    name: Unit tests (DB-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # These scripts don't touch PostgreSQL (verified 2026-10-11):
      # test:tree       -> src/lib/tree/flatten.ts
      # test:fractional -> src/lib/utils/fractional-index.ts
      # test:fallback   -> src/lib/tree/fallback.ts
      - run: npm run test:tree
      - run: npm run test:fractional
      - run: npm run test:fallback

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # All routes are ƒ (Dynamic) — `next build` performs no DB access
      # (verified: passes locally with no DATABASE_URL set). AUTH_SECRET is
      # only read at request time, not build time.
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ─────────────────────── Integration tests against real Postgres ─────────
  # Mirrors scripts/db.sh's project-local cluster: a fresh Postgres service
  # on a non-default port, schema `documentation`, ltree preloaded, seeded.
  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the version scripts/db.sh targets (18).
        image: postgres:18
        env:
          POSTGRES_DB: documentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d documentation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Prepare database (migrate + seed)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/documentation
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Navigation service integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/documentation
        run: npx tsx scripts/test-navigation.ts

      - name: Migration idempotency check (re-run must succeed)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/documentation
        run: npm run db:migrate

  # ─────────────────────── Docker image builds cleanly ─────────────────────
  # Runs only when Dockerfile / source change & doesn't push anywhere.
  # Gate: the image must build; the app must start and serve /login (200)
  # with placeholder DB creds — proving image runs standalone w/o secrets.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: documentation-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container boots and serves on port 3000
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL='postgres://ci-placeholder:ci-placeholder@host.invalid:5432/ci' \
            -e AUTH_SECRET='ci-smoke-secret' \
            -p 3000:3000 documentation-web:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            [ "$code" = "200" ] && echo "login -> 200 OK" && exit 0
            sleep 2
          done
          echo "App never answered /login with 200"; docker logs smoke; exit 1

      - name: Assert no env/secret files leaked into image
        run: |
          ! docker exec smoke find /app -maxdepth 1 -name '.env*' 2>/dev/null | grep -q .

      - name: Stop smoke container
        if: always()
        run: docker rm -f smoke || true

  # ─────────────────────── Dependency security audit ───────────────────────
  # Calibrated to repo reality (2026-10-11): prod tree carries known
  # high/critical advisories via shadcn -> ts-morph/@ts-morph/common.
  # Gate: block only on CRITICAL advisories in the production tree;
  # high/moderate surface weekly in `audit-report` below and must drain.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fail on critical advisories only
        run: npm audit --omit=dev --audit-level=critical
      - name: Upload full audit report (non-blocking)
        if: always()
        run: |
          npm audit --omit=dev --json > audit-report.json || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: audit-report.json
          if-no-files-found: ignore
