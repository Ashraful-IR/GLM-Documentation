version: 2
updates:
  # Application dependencies — weekly so high/critical advisories in the
  # prod tree (see ci.yml audit job) get fix PRs promptly.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      react-stack:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # typescript-eslint does not yet support TypeScript 7; a TS major bump
      # hard-crashes `npm run lint` (ci.yml lint gate). Let majors wait.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  # GitHub Actions used in .github/workflows/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
